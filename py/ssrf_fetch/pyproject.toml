[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-libs-ssrf-fetch"
version = "0.1.1"
description = "SSRF-säker HTTP-hämtning: IP-spärr, omdirigeringsvalidering, DNS-pinning, storlekstak, robots.txt, hastighetsbegränsning"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "httpcore>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssrf_fetch = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105"]
