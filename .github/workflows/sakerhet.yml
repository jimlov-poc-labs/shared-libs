# Hemlighetsskanning, samma mönster som Portis (beroendeskanning ligger i ci.yml per paket).
name: Säkerhet

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: sakerhet-${{ github.ref }}
  # Push-körningar skannar bara pushens commits och får därför inte avbrytas.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Hemligheter (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
