[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-libs-secretref"
version = "0.1.0"
description = "*_ref secret indirection + YAML config loading: fail-closed env:/file: resolution, vault:/kms: recognised but unwired"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6", "types-PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secretref = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
