# Månadsvisa beroendeuppdateringar. Minor och patch grupperas till en PR per ekosystem;
# major-hopp ignoreras och tas medvetet ett i taget. GitHub Actions kommer som en gruppad
# PR per månad, major-hopp inkluderade. Säkerhetsuppdateringar styrs inte av ignore-regeln.
# Lägg till ny katalog här när en förmåga skapas.
version: 2
updates:
  - package-ecosystem: pip
    directories:
      - "/py/_exempel"
      - "/py/ssrf_fetch"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: npm
    directories:
      - "/ts/_exempel"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
