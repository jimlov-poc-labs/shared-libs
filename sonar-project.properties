sonar.projectKey=shared-libs
sonar.projectName=Shared Libs
sonar.projectVersion=1.0

sonar.sources=py,ts
sonar.tests=py,ts
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/node_modules/**,**/dist/**,**/coverage/**,**/tests/**,py/*/mutationskontroll.py

# Spärrlistan i address.py är hårdkodade IP-adresser med flit (S1313).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.e1.resourceKey=**/address.py

sonar.python.version=3.12
sonar.python.coverage.reportPaths=py/*/coverage.xml
sonar.javascript.lcov.reportPaths=ts/*/coverage/lcov.info
